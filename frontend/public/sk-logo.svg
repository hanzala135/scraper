<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="rgba(0,255,180,0.08)" stroke="#00ffb4" stroke-width="2" filter="url(#glow)"></rect>

  <!-- SK Text -->
  <text x="50%" y="54%" text-anchor="middle" fill="#00ffb4" font-size="22" font-weight="800" font-family="JetBrains Mono, monospace" letter-spacing="-2">
    SK
  </text>
</svg>